[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paravec"
version = "0.1.0"
description = "Spectral analysis and staged search reference for vector indexes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
paravec = "paravec.cli:main"

[tool.setuptools.packages.find]
include = ["paravec*"]