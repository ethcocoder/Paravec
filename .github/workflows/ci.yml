name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install .
      - name: Check dependencies
        run: python -m pip check
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Install build frontend
        run: python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install built wheel
        run: python -c 'import glob, subprocess, sys; wheels = glob.glob("dist/*.whl"); assert len(wheels) == 1; subprocess.check_call([sys.executable, "-m", "pip", "install", "--no-deps", "--force-reinstall", wheels[0]])'
      - name: Smoke-test installed wheel
        run: python -c 'import subprocess, sys, tempfile; subprocess.check_call([sys.executable, "-c", "import paravec; print(paravec.__file__)"], cwd=tempfile.gettempdir())'